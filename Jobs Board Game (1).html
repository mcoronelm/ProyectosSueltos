<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jobs Board Game</title>
<style>
:root{--bg:#dff0f8;--panel:#ffffff;--ink:#17323f;--blue:#1d9bf0;--green:#7cc43f;--line:#cfe3ee;--shadow:0 6px 18px rgba(20,60,90,.15);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2230;--panel:#1a3446;--ink:#eaf5fb;--line:#2b4a5f;--shadow:0 6px 18px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0f2230;--panel:#1a3446;--ink:#eaf5fb;--line:#2b4a5f;--shadow:0 6px 18px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;min-height:100vh}
h1{margin:0;font-size:1.6rem}
.wrap{max-width:1100px;margin:0 auto;padding:14px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header p{margin:2px 0 0;opacity:.75}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:var(--panel);padding:8px;border-radius:16px;box-shadow:var(--shadow)}
.cell{position:relative;aspect-ratio:1/.92;border-radius:10px;overflow:hidden;background:#fff;border:2px solid var(--line)}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell.edge{background:linear-gradient(160deg,#37b0ff,#1479d4);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:clamp(.9rem,3vw,1.5rem);border:none}
.cell.active{outline:4px solid #ffb703;outline-offset:-4px}
.num{position:absolute;left:4px;top:3px;background:rgba(23,50,63,.8);color:#fff;font-size:.7rem;border-radius:8px;padding:0 6px;font-weight:700}
.toks{position:absolute;right:3px;bottom:3px;display:flex;gap:2px}
.tok{width:clamp(22px,5vw,38px);height:clamp(22px,5vw,38px);border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,.45);background:#fff;transition:transform .2s}
.tok svg{width:100%;height:100%;display:block}
.tok.hop{transform:translateY(-8px)}
aside{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:12px;border:3px solid transparent;background:var(--bg)}
.pl.turn{border-color:#ffb703}
.pl .av{width:64px;height:64px}
.pl b{font-size:1rem}.pl small{opacity:.7}
.dicebox{display:flex;flex-direction:column;align-items:center;gap:10px}
.die{width:84px;height:84px;background:#fff;border-radius:16px;border:3px solid #17323f;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:10px;gap:2px;box-shadow:0 5px 0 #17323f}
.die i{border-radius:50%;background:transparent}
.die i.on{background:#17323f}
.die.roll{animation:shake .5s}
@keyframes shake{0%{transform:rotate(0)}25%{transform:rotate(-18deg) translateY(-6px)}50%{transform:rotate(14deg)}75%{transform:rotate(-8deg) translateY(-3px)}100%{transform:rotate(0)}}
@media(prefers-reduced-motion:reduce){.die.roll{animation:none}.tok{transition:none}}
.tok.drag{cursor:grab;touch-action:none;outline:3px solid #ffb703;animation:pulse 1s infinite}
.cell.target{outline:4px dashed #e07a00;outline-offset:-4px;animation:pulse 1s infinite}
@keyframes pulse{50%{filter:brightness(1.18)}}
@media(prefers-reduced-motion:reduce){.tok.drag,.cell.target{animation:none}}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;background:var(--blue);color:#fff}
button:hover:not(:disabled){filter:brightness(1.08)}
button:disabled{opacity:.45;cursor:not-allowed}
button.alt{background:var(--green);color:#10300a}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
button:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
.msg{min-height:1.4em;text-align:center;font-weight:700}
.job{display:none;flex-direction:column;align-items:center;gap:8px;text-align:center}
.job.show{display:flex}
.job img{width:150px;height:136px;object-fit:cover;border-radius:12px;border:3px solid var(--green)}
.answer{font-size:1.4rem;color:#e07a00;font-weight:800;min-height:1.6em}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><clipPath id="cc"><circle cx="32" cy="32" r="31"/></clipPath></defs></svg>
<div class="wrap">
<header>
 <div><h1>Jobs Board Game</h1><p>Roll the dice, drag your avatar to the right square and say each person’s job. First to FINISH wins!</p></div>
 <button class="ghost" id="reset">New game</button>
</header>
<main class="board" id="board" aria-label="Game board"></main>
<aside>
 <section class="card players" id="players"></section>
 <section class="card dicebox">
  <div class="die" id="die" role="img" aria-label="Dice"></div>
  <button id="rollBtn">Roll the dice</button>
  <div class="msg" id="msg" aria-live="polite"></div>
 </section>
 <section class="card job" id="job">
  <div>What’s their job?</div>
  <img id="jobImg" alt="Person on the square">
  <div class="answer" id="answer"></div>
  <div class="row"><button class="alt" id="reveal">Show answer</button><button id="next">Next player</button></div>
 </section>
</aside>
</div>

const JOBS = [null,"farmer","nurse","actress","chef","doctor","pirate","dentist","singer","actor","clown","farmer","teacher","nurse","farmer","dentist","clown","pirate","chef","singer","dentist","pirate","doctor","singer","teacher","nurse","doctor","clown","chef",null];
const LAST = 29;
const AV = {
 girl:'<svg viewBox="0 0 64 64"><g clip-path="url(#cc)"><rect width="64" height="64" fill="#ffe08a"/><circle cx="11" cy="31" r="8" fill="#7a4a21"/><circle cx="53" cy="31" r="8" fill="#7a4a21"/><path d="M12 64q2-15 20-15t20 15z" fill="#ff6fa5"/><circle cx="32" cy="30" r="15" fill="#f6c9a0"/><path d="M17 29a15 15 0 0 1 30 0q-8-9-15-6-8-3-15 6z" fill="#7a4a21"/><circle cx="26" cy="32" r="2" fill="#222"/><circle cx="38" cy="32" r="2" fill="#222"/><path d="M27 38q5 4 10 0" stroke="#b5423a" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="21" cy="36" r="2.5" fill="#ff9aa8" opacity=".7"/><circle cx="43" cy="36" r="2.5" fill="#ff9aa8" opacity=".7"/><circle cx="10" cy="22" r="4" fill="#e53950"/><circle cx="54" cy="22" r="4" fill="#e53950"/></g></svg>',
 woman:'<svg viewBox="0 0 64 64"><g clip-path="url(#cc)"><rect width="64" height="64" fill="#b8e6e0"/><path d="M13 36a19 21 0 0 1 38 0v22H13z" fill="#2b1b17"/><path d="M10 64q3-14 22-14t22 14z" fill="#1fa3a3"/><circle cx="32" cy="30" r="14" fill="#e9b48a"/><path d="M17 30a15 16 0 0 1 30 0q-6-12-15-11-10-1-15 11z" fill="#2b1b17"/><circle cx="26" cy="31" r="2" fill="#222"/><circle cx="38" cy="31" r="2" fill="#222"/><path d="M27 37q5 4.5 10 0" stroke="#c0283c" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="17" cy="38" r="2" fill="#f4b400"/><circle cx="47" cy="38" r="2" fill="#f4b400"/></g></svg>'
};
const P = [{name:"Pallas",kind:"Girl",av:AV.girl},{name:"Pallas’s Mom",kind:"Woman",av:AV.woman}];
let pos=[0,0], turn=0, busy=false, over=false, current=null, pending=0, armed=false;
const $=id=>document.getElementById(id);
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function face(n){$("die").innerHTML=Array.from({length:9},(_,i)=>'<i class="'+(PIPS[n].includes(i)?'on':'')+'"></i>').join("");$("die").setAttribute("aria-label","Dice showing "+n)}
function build(){
 const b=$("board");b.innerHTML="";
 for(let r=0;r<6;r++)for(let c=0;c<5;c++){
  const i=r%2===0?r*5+c:r*5+(4-c);
  const d=document.createElement("div");d.className="cell";d.id="c"+i;
  if(i===0||i===LAST){d.classList.add("edge");d.textContent=i===0?"START":"FINISH"}
  else{d.innerHTML='<img alt="'+JOBS[i]+'" src="'+IMGS[i]+'"><span class="num">'+i+'</span>'}
  const t=document.createElement("div");t.className="toks";d.appendChild(t);b.appendChild(d);
 }
}
function renderPlayers(){
 $("players").innerHTML=P.map((p,i)=>'<div class="pl '+(i===turn&&!over?'turn':'')+'"><div class="av">'+p.av+'</div><b>'+p.name+'</b><small>'+p.kind+' · square '+pos[i]+'</small></div>').join("");
}
function renderTokens(hop){
 document.querySelectorAll(".toks").forEach(t=>t.innerHTML="");
 document.querySelectorAll(".cell").forEach(c=>c.classList.remove("active"));
 P.forEach((p,i)=>{const t=document.querySelector("#c"+pos[i]+" .toks");const e=document.createElement("div");e.className="tok"+(hop===i?" hop":"");e.title=p.name;e.innerHTML=p.av;if(i===turn&&armed){e.classList.add("drag");e.tabIndex=0;e.setAttribute("aria-label","Drag "+p.name+" to square "+pending+" (or press Enter)");e.onpointerdown=startDrag;e.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();land()}}}t.appendChild(e)});
 $("c"+pos[turn]).classList.add("active");
 document.querySelectorAll(".cell.target").forEach(c=>c.classList.remove("target"));
 if(armed)$("c"+pending).classList.add("target");
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function roll(){
 if(busy||over)return;busy=true;$("rollBtn").disabled=true;$("job").classList.remove("show");
 const die=$("die");die.classList.remove("roll");void die.offsetWidth;die.classList.add("roll");
 for(let k=0;k<8;k++){face(1+Math.floor(Math.random()*6));await wait(60)}
 const n=1+Math.floor(Math.random()*6);face(n);
 $("msg").textContent=P[turn].name+" rolled a "+n+"!";
 await wait(350);
 pending=Math.min(pos[turn]+n,LAST);
 armed=true;
 renderTokens();
 $("msg").textContent=P[turn].name+" rolled a "+n+"! Drag your avatar to the highlighted square.";
}
function land(){
 if(!armed)return;
 pos[turn]=pending;armed=false;renderTokens();renderPlayers();
 if(pos[turn]===LAST){over=true;$("msg").textContent=P[turn].name+" wins! Congratulations!";busy=false;return}
 $("msg").textContent="";
 showJob(pos[turn]);
}
function startDrag(ev){
 if(!armed)return;ev.preventDefault();
 const src=ev.currentTarget;const g=src.cloneNode(true);g.className="tok";g.removeAttribute("tabindex");
 g.style.cssText="position:fixed;z-index:50;pointer-events:none;width:58px;height:58px;left:0;top:0";
 document.body.appendChild(g);src.style.opacity=".3";
 const mv=e=>{g.style.transform="translate("+(e.clientX-29)+"px,"+(e.clientY-29)+"px)"};mv(ev);
 const up=e=>{
  document.removeEventListener("pointermove",mv);document.removeEventListener("pointerup",up);document.removeEventListener("pointercancel",up);
  g.remove();src.style.opacity="";
  const el=document.elementFromPoint(e.clientX,e.clientY);const cell=el&&el.closest(".cell");
  if(cell&&cell.id==="c"+pending)land();
  else $("msg").textContent="Not there! Drop "+P[turn].name+" on the highlighted square.";
 };
 document.addEventListener("pointermove",mv);document.addEventListener("pointerup",up);document.addEventListener("pointercancel",up);
}
function showJob(i){
 current=i;$("jobImg").src=IMGS[i];$("jobImg").alt="Person on square "+i;
 $("answer").textContent="";$("reveal").disabled=false;$("job").classList.add("show");
}
function reveal(){
 const j=JOBS[current];const a=/^[aeiou]/.test(j)?"an ":"a ";
 $("answer").textContent="a"+(a==="an "?"n ":" ")+j;
 $("reveal").disabled=true;
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance("He or she is "+a+j);u.lang="en-US";u.rate=.9;speechSynthesis.speak(u)}catch(e){}
}
function next(){
 $("job").classList.remove("show");turn=1-turn;busy=false;$("rollBtn").disabled=false;
 $("msg").textContent=P[turn].name+"’s turn";renderPlayers();renderTokens();
}
function reset(){pos=[0,0];turn=0;busy=false;over=false;armed=false;$("job").classList.remove("show");$("rollBtn").disabled=false;$("msg").textContent=P[0].name+" starts!";face(1);renderPlayers();renderTokens()}
$("rollBtn").onclick=roll;$("die").onclick=roll;$("reveal").onclick=reveal;$("next").onclick=next;$("reset").onclick=reset;
build();face(1);reset();
</script>
